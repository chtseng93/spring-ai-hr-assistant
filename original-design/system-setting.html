<script>
  // Simple interaction for the forms to simulate "unsaved changes" banner logic
  document.querySelectorAll('input, select, textarea').forEach(el => {
    el.addEventListener('change', () => {
      const banner = document.getElementById('unsaved-banner');
      if (banner && banner.style.display === 'none') {
        banner.style.display = 'flex';
        // Add a small pulse animation to draw attention
        banner.classList.add('animate-pulse');
        setTimeout(() => banner.classList.remove('animate-pulse'), 1000);
      }
    });
  });
