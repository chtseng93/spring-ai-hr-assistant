# API 設定 - 由 .env 載入
spring.ai.ollama.base-url=${OLLAMA_BASE_URL}
spring.ai.openai.base-url=${OPENAI_BASE_URL}
spring.ai.openai.api-key=${OPENAI_API_KEY}

# PostgreSQL + pgvector 資料源
spring.datasource.url=jdbc:postgresql://localhost:5434/ragdb
# 對話記憶資料表（SPRING_AI_CHAT_MEMORY）：非內嵌 DB 需明確開啟建表
spring.ai.chat.memory.repository.jdbc.initialize-schema=always
spring.datasource.username=postgres
spring.datasource.password=${POSTGRES_PASSWORD}

# Logging
logging.level.root=INFO
logging.level.org.springframework.ai=DEBUG
logging.level.com.example.demo=DEBUG
