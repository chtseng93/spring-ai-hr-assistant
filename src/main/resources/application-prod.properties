# ── Render 生產環境設定（SPRING_PROFILES_ACTIVE=prod 時生效）──

# 資料源：Neon Postgres，連線資訊由 Render 環境變數提供
spring.datasource.url=${JDBC_DATABASE_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# schema.sql 與 chat memory 表：每次開機確保存在（都是 IF NOT EXISTS，安全）
spring.sql.init.mode=always
spring.ai.chat.memory.repository.jdbc.initialize-schema=always

# Embedding 改用 Mistral 雲端（mistral-embed = 1024 維，schema 不用改）
spring.ai.model.embedding=mistral
spring.ai.mistralai.api-key=${MISTRAL_API_KEY}
spring.ai.mistralai.embedding.options.model=mistral-embed

# 在 Render 反向代理後面：讓 Spring 正確辨識 HTTPS（session cookie 的 Secure、重導 URL）
server.forward-headers-strategy=framework