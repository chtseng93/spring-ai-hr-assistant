spring.application.name=spring-ai-hr-assistant
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# chat 走 Groq（OpenAI 相容端點），embedding 留本機 Ollama
spring.ai.model.chat=openai
spring.ai.model.embedding=ollama

# Mistral starter 只用來做 prod 的 embedding，但 moderation / OCR 自動組態沒有開關，
# 一上 classpath 就強制要 api-key。給個佔位值讓它們能建 bean（dev 不會呼叫到）；prod 由環境變數覆蓋
spring.ai.mistralai.api-key=${MISTRAL_API_KEY:placeholder}

# Groq chat 模型
spring.ai.openai.chat.options.model=openai/gpt-oss-120b
spring.ai.openai.chat.options.temperature=0.7

# 本機 embedding 模型（1024 維，對應 schema.sql 的 VECTOR(1024)）
spring.ai.ollama.embedding.options.model=mxbai-embed-large

# PostgreSQL pgvector 資料源初始化
spring.sql.init.mode=always

# 帳號密碼由 .env 提供；預設值僅供本機測試 / context load，正式環境必須用環境變數覆蓋
app.auth.hr-password=${HR_PASSWORD:hr-dev-pw}
app.auth.admin-password=${ADMIN_PASSWORD:admin-dev-pw}

server.port=${PORT:8087}
